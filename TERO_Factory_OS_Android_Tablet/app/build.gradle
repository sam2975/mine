plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.tero.factoryos'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.tero.factoryos'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
